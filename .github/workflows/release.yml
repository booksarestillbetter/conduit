name: Release

# Builds the `conduit` binary (web UI embedded via RustEmbed) natively for Linux x86_64 and
# aarch64 and attaches the tarballs (plus SHA256SUMS) to a GitHub Release. Runs on every `v*`
# tag; can also be run by hand for an existing tag via "Run workflow" (useful to backfill a
# release).
#
# Binaries are built on Ubuntu 22.04 (glibc 2.35, OpenSSL 3) so they run on that and anything
# newer (Debian 12+, Ubuntu 22.04+, Fedora, Arch, ...). For older or musl-based hosts, or if
# you'd rather not manage the web UI's static assets yourself, use the Docker image.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.18.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install protoc
        # Ubuntu 22.04's apt-get protobuf-compiler (3.12) predates proto3 `optional` field
        # support without --experimental_allow_proto3_optional, which fetcher-synapse's
        # build.rs doesn't pass. Install a modern protoc instead of apt's.
        uses: arduino/setup-protoc@v3
        with:
          version: '27.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p conduit

      - name: Package
        run: |
          name="conduit-${TAG}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/conduit LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          "./$name/conduit" --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: conduit-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum conduit-*.tar.gz | tee SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Conduit ${TAG}" > notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="conduit-*.tar.gz SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "Conduit ${TAG}" --notes-file notes.md --verify-tag
          fi
