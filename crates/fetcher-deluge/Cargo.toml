[package]
name = "fetcher-deluge"
version = "0.14.7"
edition = "2021"
description = "Deluge JSON-RPC driver for Conduit/Conduit fetchers"

[dependencies]
fetcher-core = { path = "../fetcher-core" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
anyhow = "1.0"
tracing = "0.1"
