[package]
name = "fetcher-synapse"
version = "0.14.7"
edition = "2021"
description = "Synapse 2.0 gRPC streaming delta driver for Conduit/Conduit fetchers"

[dependencies]
fetcher-core = { path = "../fetcher-core" }
tonic = { version = "0.12", default-features = false, features = ["channel", "codegen", "prost"] }
prost = "0.13"
async-trait = "0.1"
tokio = { version = "1.43", features = ["sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", features = ["stream"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3.0.0"
