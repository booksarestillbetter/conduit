# nginx/conduit.conf
# Standalone Nginx Reverse Proxy Configuration for Conduit

# 1. Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 2. HTTP Server Block (Port 80 or 4242)
server {
    listen 80;
    listen [::]:80;
    server_name conduit.example.com; # Replace with your hostname or IP

    # Uncomment below to force HTTPS redirect:
    # return 301 https://$host$request_uri;

    client_max_body_size 256M;

    # Full Reverse Proxy Routing for Conduit (SPA UI, REST API, WebSockets, Metrics)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Real Client IP and Host headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming and Keepalive Timeouts
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 3. HTTPS Server Block (SSL Mode)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name conduit.example.com; # Replace with your hostname or IP

    # SSL Certificates
    ssl_certificate /data/ssl/conduit.crt;     # Path to fullchain / certificate
    ssl_certificate_key /data/ssl/conduit.key; # Path to private key

    # Modern TLS Security & Performance
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CONDUIT_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 256M;

    # Full Reverse Proxy Routing for Conduit (SPA UI, REST API, WebSockets, Metrics)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Real Client IP and Host headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming and Keepalive Timeouts
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
